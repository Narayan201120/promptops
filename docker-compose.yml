services:
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: promptops
      POSTGRES_USER: promptops
      POSTGRES_PASSWORD: promptops123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6500:6379" # Using 6500 to avoid Windows reserved port ranges

volumes:
  postgres_data:
