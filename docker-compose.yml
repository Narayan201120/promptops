version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: promptops_db
      POSTGRES_USER: promptops_user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: